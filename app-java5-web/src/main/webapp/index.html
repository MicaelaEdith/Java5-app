<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java 5</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            color: #444444;
            padding-top: 2vh;
            padding-left: 2vw;
        }

        button {
            width: 140px;
            height: 20px;
            color: grey;
            background-color: rgb(240, 238, 238);
            border: 0;
            border-radius: 3px;
        }

        img {
            margin: 0;
            padding: 0;
        }

        div {
            margin: 10px;
        }
    </style>

</head>

<body>
    <!-- Script JsonPost -->

    <hr>
    <div id="resultadoJson">

        <label for="idPost">N° Id pos:</label>
        <input type="number" id="idPost" />
        <button onClick="JsonPost()">Buscar jsonPost</button>

        <script>
            function JsonPost() {
                var id = document.getElementById("idPost").value;
                fetch(`http://localhost:8080/app-java5-web/api/jsonplaceholder?id=${id}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`Error al obtener datos: ${response.status}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        mostrarResultadosJson(data);
                    })
                    .catch(error => {
                        console.error("Error al obtener datos:", error);
                        var resultadoDiv = document.getElementById("resultadoJson");
                        resultadoDiv.innerHTML = "<p>Error al obtener datos.</p>";
                    });
            }

            function mostrarResultadosJson(data) {
                var resultadoDiv = document.getElementById("resultadoJson");

                if (data && data.id && data.title) {
                    resultadoDiv.innerHTML = `<p>ID: ${data.id}</p><p>Título: ${data.title}</p>`;
                } else {
                    resultadoDiv.innerHTML = "<p>Error al obtener datos.</p>";
                }
            }
        </script>

    </div>

    <!-- Script Covid Tracking -->

    <hr>
    <div id="resultadoCovid">

        <label for="dateCovid">Date Covid Cases:</label>
        <input type="date" id="dateCovid" />
        <button onClick="buscarCovid()">Buscar Casos</button>

        <script>
            function buscarCovid() {
                var date = document.getElementById("dateCovid").value;
                fetch(`http://localhost:8080/app-java5-web/api/covid?date=${date}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`Error al obtener datos: ${response.status}`);
                        }
                        return response.json(); // Cambiado a response.json()
                    })
                    .then(data => {
                        mostrarResultadosCovid(data);
                    })
                    .catch(error => {
                        console.error("Error al obtener datos:", error);
                        var resultadoDiv = document.getElementById("resultadoCovid");
                        resultadoDiv.innerHTML = "<p>Error al obtener datos.</p>";
                    });
            }

            function mostrarResultadosCovid(data) {
                var resultadoDiv = document.getElementById("resultadoCovid");

                if (data.success) {
                    resultadoDiv.innerHTML = `<p>Resultados: ${data.data}</p>`;
                } else {
                    resultadoDiv.innerHTML = `<p>${data.data}</p>`;
                }
            }
        </script>

    </div>

    <!-- Script Pokemon API -->

    <hr>
    <div>
        <h2>Buscar Pokémon</h2>

        <label for="pokemonInput">ID o Nombre del Pokémon:</label>
        <input type="text" id="pokemonInput" />
        <button onClick="buscarPokemon()">Buscar Pókemon</button>

        <h2>Resultados</h2>
        <div id="resultado"></div>
        <script>
            function buscarPokemon() {
                var pokemonIdOrName = document.getElementById("pokemonInput").value;
                fetch(`http://localhost:8080/app-java5-web/api/pokemon?pokemon=${pokemonIdOrName}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`Error al obtener datos: ${response.status}`);
                        }
                        return response.text();
                    })
                    .then(data => {
                        mostrarResultados(data);
                    })
                    .catch(error => {
                        console.error("Error al obtener datos:", error);
                        var resultadoDiv = document.getElementById("resultado");
                        resultadoDiv.innerHTML = "<p>Error al obtener datos.</p>";
                    });
            }

            function mostrarResultados(data) {
                var rows = data.split('\n');
                if (rows.length < 2) {
                    console.error("Error al procesar datos CSV.");
                    return;
                }

                var headers = rows[0].split(',');
                var values = rows[1].split(',');

                var resultadoDiv = document.getElementById("resultado");
                resultadoDiv.innerHTML = "<p>Resultados:</p>";

                for (var i = 0; i < headers.length; i++) {
                    if (esUrl(values[i])) {
                        resultadoDiv.innerHTML += `<img src="${values[i]}" alt="${headers[i]}" width="170">`;
                    } else {
                        resultadoDiv.innerHTML += `<p>${headers[i]}: ${values[i]}</p>`;
                    }
                }
            }

            function esUrl(str) {
                var url;
                try {
                    url = new URL(str);
                } catch (e) {
                    return false;
                }
                return url.protocol === "http:" || url.protocol === "https:";
            }

        </script>

    </div>
</body>

</html>
